name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin

    - name: Accept Android licenses
      run: yes | sdkmanager --licenses

    - name: Build debug APK
      run: ./gradlew assembleDebug
      working-directory: GPPlusLauncher

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: GPPlusLauncher/app/build/outputs/apk/debug/app-debug.apk
